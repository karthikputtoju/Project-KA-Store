# NeoLoad as Code — KarthikAutomation Practice Store
# Covers: file variables, JSON extraction (correlation), transactions, think time, populations,
# load / soak / spike scenarios and SLA profiles.
# Open with the NeoLoad GUI (File > Open) or run with neoload-cli.
# Key names can differ slightly between NeoLoad versions; if validation complains, compare with
# "NeoLoad as Code" docs for your version — fixing it is good practice for the certification.

name: KarthikAutomationStore

servers:
- name: store
  host: localhost
  port: 3000
  scheme: http

variables:
- file:
    name: users
    path: ../../test-data/users.csv
    column_names: ["email", "password"]
    is_first_line_column_names: true
    delimiter: ","
    order: sequential
    scope: global
    change_policy: each_user
    out_of_value: cycle
- file:
    name: products
    path: ../../test-data/variants.csv
    column_names: ["variantId", "productId", "name"]
    is_first_line_column_names: true
    delimiter: ","
    order: random
    scope: local
    change_policy: each_iteration
    out_of_value: cycle
- file:
    name: searches
    path: ../../test-data/search-terms.csv
    column_names: ["term", "expectedMin"]
    is_first_line_column_names: true
    delimiter: ","
    order: random
    scope: local
    change_policy: each_iteration
    out_of_value: cycle

sla_profiles:
- name: store_sla
  thresholds:
  - avg-resp-time warn >= 800ms fail >= 1500ms per interval
  - error-rate warn >= 1% fail >= 3% per test

user_paths:
# --------------------------------------------------------------- Browsers (60%)
- name: Browse
  actions:
    steps:
    - transaction:
        name: T01_Home
        sla_profile: store_sla
        steps:
        - request: { server: store, url: /api/categories }
        - request: { server: store, url: "/api/products?sort=relevance&pageSize=10&inStock=true" }
    - delay: 2s
    - transaction:
        name: T02_Search
        sla_profile: store_sla
        steps:
        - request:
            server: store
            url: /api/products?q=${searches.term}&pageSize=12
            assertions:
            - contains: '"total":'
    - delay: 3s
    - transaction:
        name: T03_ProductDetail
        sla_profile: store_sla
        steps:
        - request: { server: store, url: "/api/products/${products.productId}" }
        - request: { server: store, url: "/api/products/${products.productId}/reviews" }
    - delay: 2s

# --------------------------------------------------------------- Buyers (40%)
- name: Buy
  init:
    steps:
    - transaction:
        name: T10_Login
        sla_profile: store_sla
        steps:
        - request:
            server: store
            url: /api/auth/login
            method: POST
            headers:
            - Content-Type: application/json
            body: '{"email":"${users.email}","password":"${users.password}"}'
            extractors:
            - name: token          # correlation: JWT for the Authorization header
              jsonpath: $.accessToken
    - request:
        server: store
        url: /api/account/addresses
        headers:
        - Authorization: Bearer ${token}
        extractors:
        - name: addressId          # correlation: the user's address id
          jsonpath: $[0].id
  actions:
    steps:
    - transaction:
        name: T11_AddToCart
        sla_profile: store_sla
        steps:
        - request:
            server: store
            url: /api/cart/items
            method: POST
            headers:
            - Content-Type: application/json
            - Authorization: Bearer ${token}
            body: '{"variantId":${products.variantId},"qty":1}'
    - delay: 2s
    - transaction:
        name: T12_ViewCart
        steps:
        - request:
            server: store
            url: /api/cart
            headers:
            - Authorization: Bearer ${token}
    - transaction:
        name: T13_Slots
        steps:
        - request:
            server: store
            url: /api/delivery-slots
            extractors:
            - name: slotId         # correlation: first available slot tomorrow
              jsonpath: $[1].slots[0].id
    - delay: 3s
    - transaction:
        name: T14_Checkout
        sla_profile: store_sla
        steps:
        - request:
            server: store
            url: /api/checkout
            method: POST
            headers:
            - Content-Type: application/json
            - Authorization: Bearer ${token}
            body: '{"addressId":${addressId},"slotId":${slotId},"paymentMethod":"UPI","upiId":"success@kaupi"}'
            extractors:
            - name: orderNo        # correlation: generated order number
              jsonpath: $.orderNo
    - transaction:
        name: T15_OrderDetail
        steps:
        - request:
            server: store
            url: /api/orders/${orderNo}
            headers:
            - Authorization: Bearer ${token}
    - delay: 5s
  end:
    steps:
    - request:
        server: store
        url: /api/auth/logout
        method: POST
        headers:
        - Authorization: Bearer ${token}

populations:
- name: Shoppers
  user_paths:
  - name: Browse
    distribution: 60%
  - name: Buy
    distribution: 40%

scenarios:
- name: S0_Smoke
  populations:
  - name: Shoppers
    constant_load: { users: 2, duration: 2m }
- name: S1_Load50
  sla_profile: store_sla
  populations:
  - name: Shoppers
    rampup_load: { min_users: 5, max_users: 50, increment_users: 5, increment_every: 30s, duration: 15m }
- name: S2_Soak          # turn on the memoryLeak bug in the Test Lab first
  populations:
  - name: Shoppers
    constant_load: { users: 20, duration: 2h }
- name: S3_Spike
  populations:
  - name: Shoppers
    peaks_load:
      minimum: { users: 5, duration: 2m }
      maximum: { users: 50, duration: 1m }
      start: minimum
      duration: 15m
